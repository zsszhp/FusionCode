# =====================================
# FusionCode 全局配置
# =====================================

system:
  debug: true
  device: cpu             # cpu, cuda

logging:
  level: INFO
  save_to_file: true
  log_dir: logs/

pipeline:
  enable_stitching: true
  enable_enhancement: true
  enable_commercial_sdk: false

# 导入其他配置文件
include:
  - configs/stitching.yaml
  - configs/detection.yaml
  - configs/enhancement.yaml
  - configs/decoding.yaml
